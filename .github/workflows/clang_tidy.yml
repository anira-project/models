name: clang_tidy

# clang-tidy over the translation units of the debug build (.clang-tidy from tanh-tooling). Pull
# requests check the .cpp files they change, a change to .clang-tidy or this file sweeps them all;
# pushes to main and a dispatched run sweep every unit.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: clang_tidy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: tanh-lab/ci-actions/setup-cpp-build-tools@v0.3.18
      - uses: tanh-lab/ci-actions/cmake-build@v0.3.18
        with:
          PRESET: debug
      - uses: tanh-lab/ci-actions/clang-tidy-check@v0.3.18
        with:
          SOURCES: "core/ models/ test/"
          PRESET: debug
          CHANGED_FILES_ONLY: "true"
          FULL_SWEEP_PATTERN: '^\.clang-tidy$|^\.github/workflows/clang_tidy\.yml$'

  result:
    name: clang_tidy result
    needs: tidy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: aggregate
        run: |
          echo "tidy: ${{ needs.tidy.result }}"
          [ "${{ needs.tidy.result }}" = "success" ] || exit 1
