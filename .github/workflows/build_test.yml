name: build_test

# Desktop build + test: the logic is tanh-lab/ci-actions' reusable build-test workflow (as anira and
# tanh-lib); this file keeps only the models' facts. Every leg runs the whole suite; the model tests
# skip without ANIRA_MODELS_TEST_WEIGHTS (their weights are gigabytes), the rest (descriptions,
# core, the fetch, the licence check, the gain test models from Hugging Face) run. Pull requests
# build the "pr": true legs of .github/build_test_matrix.json, pushes to main every leg.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tier:
        description: "Matrix tier"
        type: choice
        options: ["full", "pr"]
        default: "full"

concurrency:
  group: build_test-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_test:
    name: build_test
    uses: tanh-lab/ci-actions/.github/workflows/build-test.yml@v0.3.18
    with:
      tier: ${{ inputs.tier || '' }}

  # The one status branch protection requires (called jobs report under a prefixed name).
  result:
    name: build_test result
    needs: build_test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # uses: refs cannot take a variable: assert one ci-actions version repo-wide instead.
      - name: one ci-actions version repo-wide
        run: |
          test "$(grep -rho 'tanh-lab/ci-actions[^@]*@v[0-9.]*' .github/workflows/ | grep -o 'v[0-9.]*$' | sort -u | wc -l)" -eq 1
      - name: aggregate
        run: |
          echo "workflow result: ${{ needs.build_test.result }}"
          [ "${{ needs.build_test.result }}" = "success" ] || exit 1
