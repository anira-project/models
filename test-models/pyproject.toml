[project]
name = "anira-test-models"
version = "0.1.0"
description = "anira's test networks (simple gain, stateful accumulator, typed gain, variant gain): the scripts that export and cross-check them."
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    # The ExecuTorch wheels are built against one torch release but do not declare it,
    # so the pair is pinned here: executorch 1.5.x <-> torch 2.14 (torch_pin.py at v1.5.1).
    "torch==2.14.*",
    "executorch==1.5.*",
    "numpy",
    "onnx",
    "onnxruntime",
    "onnxscript",
    "tensorflow",
]

[tool.uv]
# A collection of scripts, not an installable package.
package = false

# CPU-only torch: PyPI's Linux x86_64 and Windows wheels pull in CUDA, the macOS and
# Linux aarch64 ones are CPU builds already.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
